name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swin-frontend:
    name: Frontend swin-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npx eslint src --max-warnings 0
      - name: Build
        run: npx craco build